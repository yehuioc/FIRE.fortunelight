<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:#07080c;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.nav{height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #20232a;color:#eee9df;font-size:14px;font-weight:600}.page{padding:14px 14px 40px}.card{background:#11141a;border:1px solid rgba(255,255,255,.08);border-radius:14px}.section{padding:14px;margin-bottom:10px}.st{color:#f2eee5;font-size:14px;font-weight:600}.intro-title{color:#e3c66f;font-size:15px;font-weight:700}.copy{margin-top:5px;color:#878a94;font-size:11px;line-height:1.65}.field{margin-top:12px}.label{margin-bottom:5px;color:#81848e;font-size:11px}.control{height:40px;padding:0 10px;display:flex;align-items:center;background:#171a21;border-radius:8px;color:#ebe7de;font-size:13px}.inline{display:flex;align-items:center}.inline .control{flex:1}.suffix{margin-left:8px;color:#81848d;font-size:12px}.switchrow{padding-top:13px;display:flex;align-items:center}.switchcopy{flex:1;padding-right:11px}.switchtitle{color:#dfdbd2;font-size:13px}.switchsub{margin-top:3px;color:#777b85;font-size:10px;line-height:1.5}.switch{width:40px;height:22px;padding:2px;background:#3a3d44;border-radius:14px}.knob{width:18px;height:18px;background:#ddd;border-radius:50%}.adv{display:flex;justify-content:space-between;align-items:center;color:#b49b58}.adv-sub{margin-top:3px;color:#747781;font-size:10px}.save{height:44px;margin:15px 0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#e4bc56;color:#15130e;font-size:13px;font-weight:700}.danger{padding:14px}.dangerbtn{height:40px;margin-top:11px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#211819;color:#bd8274;font-size:11px}
.eyebrow{color:#987f3e;font-size:10px;letter-spacing:2px}.manifesto-title{margin-top:9px;color:#ece7dd;font-size:20px;line-height:1.45;font-weight:700}.gold{color:#f1c75b}.manifesto-copy{margin-top:12px;color:#90939c;font-size:12px;line-height:1.75}.step{padding:11px 0;display:flex;border-bottom:1px solid rgba(255,255,255,.07)}.stepno{width:27px;flex:none;color:#6c5c32;font-size:10px}.steptitle{color:#e2ded5;font-size:13px;font-weight:600}.stepdesc{margin-top:3px;color:#7f828c;font-size:11px;line-height:1.55}.formula{margin-top:8px;padding:9px;background:#171a21;border-radius:7px;color:#bcb9b1;font-size:11px}.boundary{padding:10px 0;color:#858892;font-size:11px;line-height:1.55;border-bottom:1px solid rgba(255,255,255,.07)}.boundary b{display:block;margin-bottom:3px;color:#d7ba63;font-size:12px}.quote{padding:15px 9px;text-align:center;color:#b49b59;font-size:12px}.privacy{text-align:center;color:#60646d;font-size:10px;line-height:1.6}
.summary{padding:13px;margin-bottom:10px}.sumtitle{font-size:14px;font-weight:600}.sumsub{margin-top:4px;color:#797d87;font-size:11px}.tx{position:relative;margin-bottom:8px;padding:11px 8px 11px 12px;display:flex;align-items:center;overflow:hidden}.bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:#9e6758}.bar.income{background:#c2a146}.txmain{flex:1;min-width:0}.txnote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.txdate{margin-top:3px;color:#70747e;font-size:9px}.amt{margin-left:6px;font-size:12px}.del{height:28px;margin-left:7px;padding:0 8px;display:flex;align-items:center;border-radius:7px;background:#211819;color:#ad786b;font-size:10px}
</style></head><body><div class="nav" id="nav"></div><div class="page" id="app"></div><script>
const app=document.getElementById('app'), nav=document.getElementById('nav');
function settings(){nav.textContent='设置与口径';app.innerHTML=`<div class="card section"><div class="intro-title">先决定怎么量，再看数字。</div><div class="copy">一般只需要出生日期和目标年龄。高级口径不要为了让结果更好看而随意修改。</div></div><div class="card section"><div class="st">人生坐标</div><div class="field"><div class="label">出生日期</div><div class="control">2000-01-01</div></div><div class="field"><div class="label">目标年龄</div><div class="inline"><div class="control">80</div><div class="suffix">岁</div></div></div><div class="switchrow"><div class="switchcopy"><div class="switchtitle">显示过去</div><div class="switchsub">打开后，也把出生至今天的日子画进人生方格。</div></div><div class="switch"><div class="knob"></div></div></div></div><div class="card section"><div class="st">起始资产</div><div class="switchrow"><div class="switchcopy"><div class="switchtitle">纳入起始资产</div><div class="switchsub">把开始记账时已有的可支配资产也折算为自由天数。</div></div><div class="switch"><div class="knob"></div></div></div></div><div class="card section"><div class="adv"><div><div class="st">高级计算口径</div><div class="adv-sub">通常保持 0 = 自动计算</div></div><span>展开</span></div></div><div class="save">保存设置</div><div class="card danger"><div class="st">本地数据</div><div class="copy">当前版本不做云同步。清除小程序数据或更换设备可能导致账本无法恢复。</div><div class="dangerbtn">清空所有本地数据</div></div>`}
function guide(){nav.textContent='理念与使用指南';app.innerHTML=`<div class="card section"><div class="eyebrow">THE CORE IDEA</div><div class="manifesto-title">把账户里的数字，<br>翻译成真正属于你的<br><span class="gold">自由时间。</span></div><div class="manifesto-copy">传统记账回答“今天花了多少”；财富自由指南灯更想回答：如果维持你真实记录出来的生活成本，当前财富究竟能支撑你自由地活多少天？</div></div><div class="card section"><div class="st">先这样用</div>${[['01','先连续记录真实数据','前 7 天当观察期，不漏记、不美化。'],['02','第一笔优先记录支出','没有生活成本，就无法给财富建立“天”的尺度。'],['03','看趋势，不审判消费','熄灭方格不是惩罚，只是现实成本被重新计入。'],['04','寻找真正的杠杆','提高长期收入、降低长期固定成本、沉淀可支配资产，才会持续改变自由天数。']].map(x=>`<div class="step"><div class="stepno">${x[0]}</div><div><div class="steptitle">${x[1]}</div><div class="stepdesc">${x[2]}</div></div></div>`).join('')}</div><div class="card section"><div class="st">核心计算</div><div class="formula">日均花销 = 总支出 ÷ 从首笔记录到今天的天数</div><div class="formula">净储蓄 = 总收入 − 总支出</div><div class="formula gold">自由天数 = ⌊净储蓄 ÷ 日均花销⌋</div></div><div class="card section"><div class="st">三条边界</div><div class="boundary"><b>不是投资建议</b>不预测收益、通胀、未来工资或资产价格。</div><div class="boundary"><b>不是预算警察</b>不判断一笔消费“该不该花”。</div><div class="boundary"><b>不是寿命预测</b>目标年龄只是可视化坐标。</div></div><div class="quote">“数据是真相，动画是仪式。仪式服从真相。”</div><div class="privacy">当前 v0.2.0 不要求登录，不把账本上传至开发者服务器。</div>`}
function history(){nav.textContent='全部记录';app.innerHTML=`<div class="card summary"><div class="sumtitle">3 笔记录</div><div class="sumsub">删除后会按剩余账本立即重算自由天数。</div></div>${[['income','项目尾款','2026-08-21','+¥2,000'],['','午餐','2026-08-21','−¥28'],['','交通','2026-08-20','−¥16']].map(x=>`<div class="card tx"><div class="bar ${x[0]}"></div><div class="txmain"><div class="txnote">${x[1]}</div><div class="txdate">${x[2]}</div></div><div class="amt ${x[0]?'gold':''}">${x[3]}</div><div class="del">删除</div></div>`).join('')}`}
</script></body></html>

const p=new URLSearchParams(location.search), mode=p.get('mode')||'onboarding1';
const app=document.getElementById('app');
function foot(active,back){return `<div class="foot"><div class="dots">${[0,1,2,3].map(i=>`<i class="dot ${i===active?'active':''}"></i>`).join('')}</div><div class="actions">${back?'<button class="btn secondary">上一步</button>':'<div class="spacer"></div>'}<button class="btn primary">${active===3?'开始记录':'继续'}</button></div></div>`}
if(mode==='onboarding1')app.innerHTML=`<div class="onboarding"><div class="head"><div class="eyebrow">DAYS OF FREEDOM</div><div class="brand">财富自由指南灯</div></div><div class="body"><div class="panel"><div class="no">01 · 核心理念</div><div class="title">钱不是终点。<br>真正稀缺的是<br><span class="gold">属于你自己的时间。</span></div><div class="formula"><div>财富</div><div class="arrow">→</div><div>生活成本</div><div class="arrow">→</div><div>自由天数</div></div><div class="copy">我们不只告诉你“赚了多少钱”，而是把净储蓄翻译成：按你真实的生活成本，究竟为自己买回了多少天自由。</div></div></div>${foot(0,false)}</div>`;

if(mode==='home')app.innerHTML=`<div class="home"><div class="topbar"><div><div class="eyebrow">DAYS OF FREEDOM</div><div class="top-title">财富自由指南灯</div></div><div class="top-actions"><div class="chip">理念</div><div class="chip">设置</div></div></div><div class="hero"><div class="metric"><div class="num">3,824</div><div class="unit">天自由</div></div><div class="sub">按当前口径，距目标还差 7,356 天</div><div class="track"><div class="fill"></div></div><div class="meta"><span>34.2%</span><span>持续记录比单日波动更重要</span></div></div><div class="card insight"><div class="mark"></div><div><div class="ins-label">当前解读</div><div class="ins-text">按当前约 ¥86/天的生活成本，你已经买到 3824 天自由。</div></div></div><div class="card grid-card"><div class="section-head"><div><div class="section-title">人生方格</div><div class="section-sub">每一格 = 生命中的一天</div></div><div class="legend"><span>■ 已点亮</span><span>■ 未点亮</span></div></div><div class="canvas-shell"><canvas id="c"></canvas></div><div class="grid-meta"><span>净储蓄 ¥328,864</span><span>日均 ¥86</span></div></div><div class="card record"><div class="section-title">记一笔真实的账</div><div class="record-sub">不要为了让方格好看而修改现实。</div><div class="seg"><div class="active">支出</div><div>收入</div></div><div class="amount"><span class="currency">¥</span><div class="amount-val">28.00</div></div><div class="formrow"><div class="ctl">2026-08-21</div><div class="ctl">备注（选填）</div></div><div class="submit">记录支出 · 更新现实</div></div></div>`;
if(mode==='home'){const c=document.getElementById('c');const r=c.getBoundingClientRect(),d=devicePixelRatio;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);x.fillStyle='#0b0e13';x.fillRect(0,0,r.width,r.height);const N=11180,lit=3824,cell=1.5,gap=.45,cols=Math.floor((r.width+gap)/(cell+gap)),rows=Math.ceil(N/cols),gh=rows*cell+(rows-1)*gap,oy=(r.height-gh)/2;for(let i=0;i<N;i++){const col=i%cols,row=Math.floor(i/cols);x.fillStyle=i<lit?'#f1c75b':'#292d35';x.fillRect(col*(cell+gap),oy+row*(cell+gap),cell,cell)}}

function guide(){return `<div class="screen guide"><div class="card manifesto"><div class="g-eyebrow">THE CORE IDEA</div><div class="g-title">钱只是数字。<br>真正要买回来的，<br><span class="gold">是属于自己的时间。</span></div><div class="g-copy">财富自由指南灯不想再问“账户里有多少钱”，而是把财富翻译成更接近人生的问题：按照你的生活成本估计，这些自由财富究竟能支撑多少天不被下一份工资逼着做选择？</div></div><div class="card"><div class="title">这里只记录“自由事件”</div><div class="boundary"><b>真正新增自由财富</b><div>工资、真实赚到的钱、真正增加你可支配资源的收入，应该进入模型。</div></div><div class="boundary"><b>真正的生活消耗</b><div>房租、吃饭、娱乐、交通等真实消耗生活资源的支出，应该进入模型。</div></div><div class="boundary"><b>不改变自由本质的现金流，不要记</b><div>自己的账户互转、已经记过消费后的信用卡还款、借款本金，都不应该伪装成新增财富或新的生活消耗。退款和报销应优先修正原支出。</div></div></div><div class="card"><div class="title">熄灭不是惩罚，它在显示一次交换</div><div class="boundary"><b>生活消耗会降低未来自由</b><div>方格熄灭是在呈现机会成本，不是在评价消费“对不对”。</div></div><div class="boundary"><b>你是在拿未来自由交换今天的价值</b><div>一顿喜欢的饭、一次旅行、给家人的礼物都可能值得。指南灯只把“拿什么换了什么”照出来，值不值由你决定。</div></div></div><div class="card"><div class="title">FREE 到底意味着什么</div><div class="boundary"><b>当前人生区间已被覆盖</b><div>按照你现在的生活成本估计、人生坐标与自由资源，现有资源已经覆盖剩余人生方格。</div></div><div class="boundary"><b>它不是永久退休证明</b><div>这里没有假设投资收益率、安全提取率、通胀或未来收入。</div></div></div></div>`}
function free(){return `<div class="free"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="inside"><div class="topline">CURRENT HORIZON FULLY COVERED</div><div class="word">FREE</div><div class="zh">财 富 自 由</div><div class="desc">按当前生活成本与人生坐标，现有自由资源已覆盖剩余人生</div></div></div>`}

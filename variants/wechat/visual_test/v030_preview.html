const mode=new URLSearchParams(location.search).get('mode')||'home';
const cells=()=>Array.from({length:1300},(_,i)=>`<i class="cell ${i<430?'lit':''}"></i>`).join('');
function home(paper=false){return `<div class="screen ${paper?'paper':''}"><div class="top"><div><div class="eyebrow">DAYS OF FREEDOM</div><div class="title">财富自由指南灯</div></div><div class="actions"><div class="pill">理念</div><div class="pill">设置</div></div></div><div class="hero"><div><span class="big">430</span><span class="unit">天自由</span></div><div class="sub">按当前口径，距目标还差 18,790 天</div><div class="track"><div class="fill"></div></div><div class="meta"><span>2.2%</span><span>上手版 · 手动设定</span></div></div><div class="card modestrip"><div><div class="mt">当前模式 · 上手版</div><div class="md">余额随收支直接变化</div></div><div class="ma">调整 ›</div></div><div class="card insight"><div class="dotmark"></div><div><div class="label">当前解读</div><div class="copy">当前可支配资金约 ¥34,400，按 ¥80/天，可覆盖约 430 天自由生活。</div></div></div><div class="card"><div class="sectionhead"><div><div class="sectiontitle">人生方格</div><div class="sub2">每一格 = 生命中的一天</div></div><div class="sub2">已点亮　未点亮</div></div><div class="canvas">${cells()}</div><div class="gridmeta"><span>当前可支配资金 ¥34,400</span><span>日均 ¥80</span></div></div><div class="card"><div class="sectiontitle">记一笔真实的账</div><div class="sub2">上手版中，每笔收支会直接改变当前可支配资金与自由天数。</div><div class="seg"><div class="active">支出</div><div>收入</div></div><div class="amount"><div class="currency">¥</div><div class="amountval">28.00</div></div><div class="formrow"><div class="ctl">2026-08-21</div><div class="ctl">备注（选填）</div></div><div class="submit">记录支出 · 熄灭自由时间</div></div><div class="stats"><div class="card stat"><div class="statlabel">总收入</div><div class="statval">¥0</div></div><div class="card stat"><div class="statlabel">总支出</div><div class="statval">¥0</div></div><div class="card stat"><div class="statlabel">日均花销</div><div class="statval">¥80</div></div><div class="card stat"><div class="statlabel">成本口径</div><div class="statval">手动设定</div></div></div></div>`}
function onboarding(advanced=false,paper=false){return `<div class="onb ${paper?'paper':''}"><div><div class="eyebrow">DAYS OF FREEDOM</div><div class="brand">财富自由指南灯</div></div><div class="body"><div class="no">04 · 选择你的起步方式</div><div class="gtitle">简单上手，或完全自己掌舵。</div><div class="modes"><div class="mode ${!advanced?'active':''}"><div class="modetitle">上手版</div><div class="modedesc">直接告诉我们“一天多少钱”和“现在有多少钱”，打开首页就能看到自由方格。</div></div><div class="mode ${advanced?'active':''}"><div class="modetitle">高级自主版</div><div class="modedesc">自己决定成本来源、资产口径和方格范围。</div></div></div><div class="group"><div class="grouptitle">人生坐标</div><div class="field"><div class="fieldlabel">出生日期</div><div class="input">2000-01-01</div></div><div class="field"><div class="fieldlabel">目标年龄</div><div class="input">80 岁</div></div></div>${advanced?`<div class="group"><div class="grouptitle">高级计算口径</div><div class="field"><div class="fieldlabel">每日生活成本来源</div><div class="twoseg"><span class="active">手动设定</span><span>账本自动</span></div></div><div class="field"><div class="fieldlabel">手动日均生活成本</div><div class="input money">¥　80</div></div><div class="switchrow"><div class="switchcopy">纳入已有可支配资产<div class="switchdesc">把现在已经积累的可支配资金也换算成自由天数。</div></div><div class="switch"></div></div><div class="field"><div class="fieldlabel">当前可支配资产</div><div class="input money">¥　30000</div></div><div class="switchrow"><div class="switchcopy">显示已经走过的人生<div class="switchdesc">出生至今天的日子也进入人生方格。</div></div><div class="switch"></div></div></div>`:`<div class="group"><div class="grouptitle">立即点亮所需的两个数字</div><div class="field"><div class="fieldlabel">你估计一天真实生活需要多少钱</div><div class="input money">¥　80</div></div><div class="field"><div class="fieldlabel">当前真正可自由支配的存量资金</div><div class="input money">¥　30000</div></div><div class="note">保存后立即按“可支配资金 ÷ 每日生活成本”点亮方格。以后每笔收入与支出都会继续改变它。</div></div>`}<div class="sub2" style="margin-top:12px">目标年龄只是可视化坐标；本工具是数学观察模型，不提供投资、收益或寿命预测。</div></div><div class="foot"><div class="dots">···—</div><div class="buttons"><div class="b back">上一步</div><div class="b next">建立我的指南灯</div></div></div></div>`}
function settings(paper=false,advanced=false){const modeCard=`<div class="card"><div class="sectiontitle">使用模式</div><div class="modeopt"><div class="mo ${!advanced?'active':''}"><h4>上手版</h4><p>余额口径：收支直接改变当前资金与方格。</p></div><div class="mo ${advanced?'active':''}"><h4>高级自主版</h4><p>原始账本模型：开放成本、统计天数、起始资产与方格范围。</p></div></div></div>`;const coords=`<div class="card"><div class="sectiontitle">人生坐标</div><div class="field"><div class="fieldlabel">出生日期</div><div class="ctl">2000-01-01</div></div><div class="field"><div class="fieldlabel">目标年龄</div><div class="ctl">80 岁</div></div></div>`;const quick=`<div class="card"><div class="sectiontitle">上手版口径</div><div class="sdesc">给出日均成本和当前资金即可立即点亮；之后收支直接改变余额。</div><div class="field"><div class="fieldlabel">日均生活成本</div><div class="ctl">¥ 80</div></div><div class="field"><div class="fieldlabel">起点资金（当前余额的计算基准）</div><div class="ctl">¥ 30000</div></div><div class="note" style="background:#161922;color:#858995">按现有账本计算的当前可支配资金：¥34,400</div><div class="note" style="background:#161922;color:#858995">当前资金 = 起点资金 + 后续收入 − 后续支出；自由天数 = 当前资金 ÷ 日均成本。</div></div>`;const adv=`<div class="card"><div class="sectiontitle">生活成本口径</div><div class="field"><div class="fieldlabel">成本来源</div><div class="twoseg"><span>手动设定</span><span class="active">账本自动</span></div></div><div class="note" style="background:#161922;color:#858995">自动口径：累计有效支出 ÷ 统计天数。默认从首笔有效记录算到今天。</div><div class="field"><div class="fieldlabel">统计天数覆盖（0 = 自动）</div><div class="ctl">30 天</div></div></div><div class="card"><div class="sectiontitle">资产与方格</div><div class="switchrow"><div class="switchcopy">纳入已有可支配资产<div class="switchdesc">把起步时已经积累的可支配资金也折算为自由天数。</div></div><div class="switch"></div></div><div class="field"><div class="fieldlabel">起步基准可支配资产</div><div class="ctl">¥ 30000</div></div><div class="switchrow"><div class="switchcopy">显示已经走过的人生<div class="switchdesc">出生至今天的日子也会画进人生方格。</div></div><div class="switch"></div></div></div>`;const themes=`<div class="card"><div class="sectiontitle">主题装扮</div><div class="themeopt"><div class="preview"></div><div><b>深夜金</b><div class="sdesc">克制、沉静。</div></div></div><div class="themeopt"><div class="preview paperprev"></div><div><b>纸上自由</b><div class="sdesc">暖纸、墨色与旧金。</div></div></div></div>`;return `<div class="settings ${paper?'paper':''}"><div class="card"><div class="stitle">模型的控制权属于你。</div><div class="sdesc">上手版追求立即可用；高级自主版让你决定生活成本、资产和方格口径。</div></div>${modeCard}${coords}${advanced?adv:quick}${themes}<div class="save">保存并重新计算</div></div>`}
let html=''; if(mode==='home')html=home(false);if(mode==='home-paper')html=home(true);if(mode==='onb-quick')html=onboarding(false,false);if(mode==='onb-advanced')html=onboarding(true,false);if(mode==='onb-quick-paper')html=onboarding(false,true);if(mode==='settings')html=settings(false,false);if(mode==='settings-advanced')html=settings(false,true);if(mode==='settings-paper')html=settings(true,false);document.getElementById('app').innerHTML=html;
</script></body></html>
